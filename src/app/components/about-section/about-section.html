<section id="about" class="about-section" aria-labelledby="about-heading">
  <div class="container">
    <div class="about-card">
      <!-- Left Column: Icon & Headline -->
      <div class="about-lead">
        <div class="leaf-icon-wrapper" aria-hidden="true">
          <!-- Leaf / Plant sprout SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">

        </div>
        <h2 id="about-heading" class="about-title">
          Care for your child.<br />
          Support for your day.
        </h2>
      </div>

      <!-- Divider (Desktop) -->
      <div class="about-divider" aria-hidden="true"></div>

      <!-- Right Column: Narrative Copy -->
      <div class="about-body">
        <p class="about-text">
          {{ siteData.about.body }}
        </p>
      </div>
    </div>
  </div>
</section>
